[project]
name = "gonpypoc"
version = "0.1.0"
description = "Proof of concept for importing Go code in Python programs"
readme = "README.md"
authors = [
    { name = "Sean Jain Ellis", email = "sellis@bandarji.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
gonpypoc = "gonpypoc:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
